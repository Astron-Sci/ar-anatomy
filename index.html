<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR人体解剖 - Body AR Anatomy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="video-container">
            <video id="video" playsinline autoplay muted></video>
        </div>
        <div id="three-container"></div>
        <div id="ui-overlay">
            <div id="header" class="hidden">
                <h1>🧠 AR 人体解剖</h1>
                <p class="subtitle">AI自动跟踪 · 25秒无人则切换手动</p>
            </div>
            <div id="controls" class="hidden">
                <button id="btn-bones" class="active" data-layer="skeleton">🦴 骨骼</button>
                <button id="btn-muscles" data-layer="muscles">💪 肌肉</button>
                <button id="btn-organs" data-layer="organs">🫀 器官</button>
                <button id="btn-all">👤 全部</button>
            </div>
            <div id="camera-control" class="hidden">
                <button id="btn-switch-cam">🔄 切摄像头</button>
                <select id="cam-select" class="hidden">
                    <option value="">选择摄像头...</option>
                </select>
                <button id="btn-manual" class="hidden">✋ 手动</button>
            </div>
            <div id="zoom-control" class="hidden">
                <button id="zoom-in">＋</button>
                <span id="zoom-label">1.0x</span>
                <button id="zoom-out">－</button>
            </div>
            <div id="status-bar" class="hidden">
                <span id="status-text">启动中...</span>
            </div>
            <div id="start-overlay">
                <div class="start-box">
                    <h2>🧠 AR 人体解剖</h2>
                    <p>AI自动识别人体，叠加3D解剖模型<br>25秒无检测自动切换手动拖动</p>
                    <button id="btn-start">🔍 开始体验</button>
                    <p class="start-tip">面对摄像头站1.5-2米 | 也可随时点"手动模式"</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.170.0/build/three.min.js"></script>
    <script src="https://unpkg.com/@mediapipe/pose/pose.js"></script>
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="app.js"></script>
</body>
</html>
